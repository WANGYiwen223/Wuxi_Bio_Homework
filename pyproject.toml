[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-it-helpdesk"
version = "0.1.0"
description = "Stateful employee-facing IT support agent with local mock backends"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
  "langgraph>=1.1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "openai>=2,<3",
  "python-dotenv>=1,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
